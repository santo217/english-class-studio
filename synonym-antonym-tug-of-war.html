<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Easy Adjective Tug-of-War</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#e8f5ff,#fff8dc);color:#17324d}header{background:#16324f;color:white;padding:14px 4%;display:flex;justify-content:space-between;align-items:center}header h1{margin:0}a{color:white}.wrap{max-width:1200px;margin:auto;padding:16px}.card{background:white;border-radius:22px;padding:18px;box-shadow:0 8px 25px #16324f22;margin-bottom:15px;text-align:center}.choices,.tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:13px 20px;font-size:1.05rem;font-weight:bold;cursor:pointer;box-shadow:0 4px #0002}.btn:active{transform:translateY(3px)}.pick{background:#e7eef6}.pick.active{background:#16324f;color:white}.start{background:#219653;color:white;font-size:1.25rem}.hidden{display:none!important}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.teamhead{color:white;border-radius:16px;padding:10px}.blue{background:#2878dc}.red{background:#e34c4c}.score{font-size:2rem;font-weight:900}.arena{height:155px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#9edcff 0 65%,#70c66b 65%);margin:15px 0}.middle{position:absolute;left:50%;height:100%;border-left:5px dashed white}.rope{position:absolute;left:5%;right:5%;top:72px;height:12px;border-radius:8px;background:#98602d;box-shadow:0 3px #653b18;transition:.45s}.knot{position:absolute;left:50%;top:-15px;width:42px;height:42px;border-radius:50%;background:#e0a055;border:5px solid #704019;transform:translateX(-50%)}.flag{position:absolute;left:50%;top:-57px;height:48px;border-left:7px solid #333}.flag:after{content:'★';position:absolute;left:0;background:#ffd43b;font-size:25px;width:43px;height:34px}.kid{position:absolute;top:96px;font-size:40px}.kid.l{left:5%}.kid.r{right:5%;transform:scaleX(-1)}.instruction{font-weight:900;color:#637083}.word{font-size:clamp(3rem,9vw,6rem);font-weight:900;margin:3px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:18px}.teamplay{padding:14px;border-radius:20px}.bluebox{background:#e7f2ff;border:4px solid #2878dc}.redbox{background:#ffebeb;border:4px solid #e34c4c}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{min-height:65px;border:3px solid #c7d3df;border-radius:14px;background:white;font-size:1.3rem;font-weight:900;cursor:pointer}.correct{background:#bdf0ca!important;border-color:#219653!important}.wrong{background:#ffcaca!important;border-color:#e34c4c!important}.message{min-height:38px;font-size:1.2rem;font-weight:900;margin-top:12px}.small{background:#e8eef5}.danger{background:#ffdcdc;color:#9b2222}.winner{position:fixed;inset:0;background:#10243de9;display:flex;align-items:center;justify-content:center}.winbox{background:white;border-radius:25px;padding:35px;text-align:center}@media(max-width:680px){.teams{grid-template-columns:1fr}.scoreboard{grid-template-columns:1fr 1fr}.round{grid-column:1/-1;grid-row:1}}
</style></head><body><header><h1>🪢 Easy Adjective Tug-of-War</h1><a href="index.html">← Studio</a></header><main class="wrap">
<section class="card" id="setup"><h2>Both teams play at the same time!</h2><p>The first team to tap the correct answer pulls the rope.</p><div class="choices"><button class="btn pick active" data-mode="synonym">Synonyms</button><button class="btn pick" data-mode="antonym">Antonyms</button><button class="btn pick" data-mode="mixed">Mixed</button></div><p>Basic beginner adjectives only.</p><button class="btn start" id="startBtn">Start ▶</button></section>
<section class="card hidden" id="game"><div class="scoreboard"><div class="teamhead blue">BLUE TEAM<div class="score" id="blueScore">0</div></div><div class="round"><b id="modeTitle">SYNONYMS</b><div id="number">Question 1</div></div><div class="teamhead red">RED TEAM<div class="score" id="redScore">0</div></div></div>
<div class="arena"><div class="middle"></div><div class="rope" id="rope"><div class="flag"></div><div class="knot"></div></div><div class="kid l">🧒💪</div><div class="kid r">🧒💪</div></div><div class="instruction" id="instruction"></div><div class="word" id="word"></div>
<div class="teams"><div class="teamplay bluebox"><h2>🔵 BLUE TEAM</h2><div class="answers" id="blueAnswers"></div></div><div class="teamplay redbox"><h2>🔴 RED TEAM</h2><div class="answers" id="redAnswers"></div></div></div><div class="message" id="message"></div><div class="tools"><button class="btn small" id="readBtn">🔊 Read word</button><button class="btn small" id="skipBtn">Skip</button><button class="btn danger" id="newBtn">New game</button></div></section></main>
<div class="winner hidden" id="winner"><div class="winbox"><div style="font-size:65px">🏆🎉</div><h2 id="winnerText"></h2><button class="btn start" id="againBtn">Play again</button></div></div><script>
const words=[['good','nice','bad'],['bad','awful','good'],['fast','quick','slow'],['slow','not fast','fast'],['beautiful','pretty','ugly'],['pretty','beautiful','ugly'],['far','distant','near'],['near','close','far'],['easy','simple','hard'],['hard','difficult','easy'],['big','large','small'],['small','little','big'],['hot','warm','cold'],['cold','chilly','hot'],['happy','glad','sad'],['sad','unhappy','happy'],['old','ancient','new'],['new','fresh','old'],['clean','tidy','dirty'],['dirty','not clean','clean'],['loud','noisy','quiet'],['quiet','silent','loud'],['strong','powerful','weak'],['weak','not strong','strong']];
const extras=['fast','slow','big','small','hot','cold','happy','sad','good','bad','easy','hard','far','near','pretty','ugly'];
let mode='synonym',deck=[],i=0,pos=0,scores={blue:0,red:0},open=true;const shuffle=a=>[...a].sort(()=>Math.random()-.5);
document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pick').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});
function q(){let x=deck[i],type=mode==='mixed'?(i%2?'antonym':'synonym'):mode,correct=type==='synonym'?x[1]:x[2],wrong=shuffle(extras.filter(y=>y!==correct&&y!==x[0])).slice(0,3);return{word:x[0],type,correct,options:shuffle([correct,...wrong])}}
function start(){deck=shuffle(words);i=pos=0;scores={blue:0,red:0};setup.classList.add('hidden');game.classList.remove('hidden');winner.classList.add('hidden');draw();question()}
function draw(){blueScore.textContent=scores.blue;redScore.textContent=scores.red;rope.style.transform='translateX('+(pos*5)+'%)'}
function question(){if(i>=deck.length){deck=shuffle(words);i=0}open=true;message.textContent='Ready? Both teams can answer!';let x=q();modeTitle.textContent=mode==='mixed'?'MIXED':x.type.toUpperCase()+'S';number.textContent='Question '+(i+1);instruction.textContent='CHOOSE THE '+x.type.toUpperCase()+' FOR';word.textContent=x.word;buttons(blueAnswers,'blue',x);buttons(redAnswers,'red',x)}
function buttons(box,team,x){box.innerHTML=x.options.map(y=>'<button class="answer" data-a="'+y+'">'+y+'</button>').join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b,team,x))}
function answer(b,team,x){if(!open)return;if(b.dataset.a!==x.correct){b.classList.add('wrong');b.disabled=true;message.textContent=(team==='blue'?'🔵 Blue':'🔴 Red')+' team: try again!';sound(170);return}open=false;b.classList.add('correct');document.querySelectorAll('.answer').forEach(z=>z.disabled=true);scores[team]++;pos+=team==='blue'?-1:1;message.textContent='✅ '+team.toUpperCase()+' TEAM! '+x.word+' → '+x.correct;sound(720);draw();if(Math.abs(pos)>=5||scores[team]>=7)setTimeout(()=>win(team),700);else setTimeout(()=>{i++;question()},1500)}
function win(team){winnerText.textContent=team.toUpperCase()+' TEAM WINS!';winner.classList.remove('hidden');sound(900)}
function sound(f){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.08;o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.stop(c.currentTime+.2)}catch(e){}}
startBtn.onclick=start;againBtn.onclick=start;newBtn.onclick=()=>{game.classList.add('hidden');setup.classList.remove('hidden')};skipBtn.onclick=()=>{i++;question()};readBtn.onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(word.textContent))}};
</script></body></html>
