<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>English Learning Arcade</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f7fc;color:#17324d}header{background:#16324f;color:#fff;padding:15px 4%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}header h1{margin:0}header a{color:#fff}.wrap{max-width:1150px;margin:auto;padding:18px}.hero,.panel{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 25px #16324f1d;margin-bottom:18px}.hero{text-align:center;background:linear-gradient(135deg,#fff,#fff5c9)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}.game-card{border:3px solid #d9e5ef;border-radius:18px;padding:17px;background:#fff;display:flex;flex-direction:column}.game-card h2{margin:5px 0}.game-card p{flex:1}.tag{font-size:.8rem;font-weight:900;color:#526579;text-transform:uppercase}.btn{border:0;border-radius:13px;padding:12px 18px;font-weight:900;font-size:1rem;cursor:pointer;background:#e8eef5;color:#17324d;box-shadow:0 4px #0002}.btn:active{transform:translateY(3px)}.play{background:#219653;color:white}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.score{background:#16324f;color:#fff;border-radius:15px;padding:10px 18px;font-size:1.2rem;font-weight:bold}.explain{background:#fff7cf;border-left:7px solid #f2c94c;border-radius:12px;padding:14px;text-align:left}.progress{height:12px;background:#dfe9f1;border-radius:9px;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:#2f80ed;transition:.3s}.question{text-align:center;font-size:clamp(1.5rem,4vw,2.4rem);font-weight:900;margin:22px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:68px;border:3px solid #cbd8e4;background:#f8fbfd;border-radius:15px;font-size:1.2rem;font-weight:900;cursor:pointer}.answer:hover{border-color:#2f80ed;background:#eaf4ff}.correct{background:#c9f4d3!important;border-color:#219653!important}.wrong{background:#ffd2d2!important;border-color:#eb5757!important}.feedback{text-align:center;min-height:40px;font-size:1.15rem;font-weight:900;margin:12px}.tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.result{text-align:center;padding:28px}.result h2{font-size:2.3rem}.stars{font-size:3rem}@media(max-width:600px){.answers{grid-template-columns:1fr}}
</style></head><body><header><h1>🎮 English Learning Arcade</h1><a href="index.html">← English Class Studio</a></header><main class="wrap">
<section class="hero" id="home"><h2>Choose one English activity</h2><p>Every grammar target has a separate explanation and game. Each game contains 20 questions.</p><div class="grid" id="cards"></div></section>
<section class="panel hidden" id="playArea"><div class="top"><button class="btn" id="backBtn">← All games</button><h2 id="title"></h2><div class="score">⭐ <span id="score">0</span> points</div></div><div class="explain" id="explain"></div><div class="progress"><div class="bar" id="bar"></div></div><div id="counter"></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="tools"><button class="btn" id="readBtn">🔊 Read</button><button class="btn" id="restartBtn">↻ Restart</button></div></section>
<section class="panel result hidden" id="result"><div class="stars">🏆⭐🏆</div><h2>Activity complete!</h2><p id="finalScore"></p><button class="btn play" id="againBtn">Play again</button> <button class="btn" id="menuBtn">Choose another game</button></section></main><script>
const actions=['swim','run','jump','dance','sing','read','write','draw','cook','climb','help','listen','speak English','ride a bike','play soccer','open the door','close the book','clean the room','carry the bag','answer the question'];
const rules=['listen to the teacher','do your homework','raise your hand','be kind','walk in the classroom','keep the room clean','bring your book','follow instructions','share materials','arrive on time','respect classmates','use kind words','put trash in the bin','take care of books','wash your hands','wait for your turn','work with your team','wear your uniform','complete your work','tell the truth'];
const bad=['run in the classroom','hit classmates','throw trash','shout at the teacher','break school materials','push others','cheat on a test','use bad words','leave without permission','play with scissors','write on the wall','take things without asking','eat during the lesson','interrupt others','damage books','fight at school','ignore instructions','make fun of others','climb on chairs','bring dangerous objects'];
const advice=['study for the test','drink water','sleep early','help your family','practice English','eat healthy food','say please','say thank you','ask for help','read every day','listen carefully','keep your desk clean','share with others','exercise','be patient','check your work','speak slowly','try again','save water','protect animals'];
const objects=['a pencil','a book','an eraser','a ruler','a backpack','a notebook','a red pen','two crayons','a lunch box','a water bottle','a ball','a toy','a computer','a dictionary','a marker','some paper','a school uniform','a blue folder','three stickers','a small bag'];
const foods=['apples','bananas','pizza','rice','chicken','ice cream','milk','oranges','sandwiches','watermelon','grapes','fish','bread','cheese','salad','cookies','carrots','mangoes','pasta','soup'];
const verbs=[['run','🏃'],['jump','🦘'],['eat','🍎'],['drink','🥤'],['read','📖'],['write','✏️'],['sleep','😴'],['swim','🏊'],['sing','🎤'],['dance','💃'],['cook','🍳'],['clean','🧹'],['climb','🧗'],['draw','🎨'],['listen','👂'],['speak','🗣️'],['open','📂'],['close','📕'],['sit','🪑'],['stand','🧍']];
const definitions={can:['CAN','Use can for an ability: “I can swim.”'],cannot:['CANNOT',"Use cannot/can’t for an ability you do not have: “I cannot fly.”"],must:['MUST','Use must for an important rule: “You must listen.”'],mustnot:['MUST NOT','Use must not for something prohibited: “You must not run.”'],should:['SHOULD','Use should for good advice: “You should study.”'],shouldnot:['SHOULD NOT','Use should not for advice against something: “You should not shout.”'],have:['HAVE / DO NOT HAVE','Use have for possession: “I have a pencil.” Use do not have when you do not possess it.'],like:['LIKE / DO NOT LIKE','Use like for preferences: “I like apples.” Use do not like for a negative preference.'],verbs:['BASIC VERBS','Read the action or emoji and identify the correct verb.'],sentences:['SENTENCE BUILDER','Choose the words in the correct order to make a complete sentence.']};
const rand=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>[...a].sort(()=>Math.random()-.5);
function grammar(key,list,correct,other,prefix){return list.map((x,n)=>({q:(prefix||'Complete:')+' ___ '+x+'.',a:correct,w:[other,'is','are'],why:'Correct sentence: '+correct+' '+x+'.'}))}
function make(key){if(key==='can')return grammar(key,actions,'I can','I must','Complete:');if(key==='cannot')return grammar(key,actions,'I cannot','I have','Complete:');if(key==='must')return grammar(key,rules,'You must','You can not','School rule:');if(key==='mustnot')return grammar(key,bad,'You must not','You should','School rule:');if(key==='should')return grammar(key,advice,'You should','You must not','Good advice:');if(key==='shouldnot')return grammar(key,bad,'You should not','You can','Good advice:');if(key==='have')return objects.map((x,n)=>({q:(n%2?'Negative:':'Positive:')+' ___ '+x+'.',a:n%2?'I do not have':'I have',w:['I like','I can','I must'],why:(n%2?'I do not have ':'I have ')+x+'.'}));if(key==='like')return foods.map((x,n)=>({q:(n%2?'Negative preference:':'Positive preference:')+' ___ '+x+'.',a:n%2?'I do not like':'I like',w:['I have','I can','I must'],why:(n%2?'I do not like ':'I like ')+x+'.'}));if(key==='verbs')return verbs.map((x,n)=>({q:x[1]+' Which verb is this?',a:x[0],w:shuffle(verbs.filter(y=>y[0]!==x[0]).map(y=>y[0])).slice(0,3),why:'The action is '+x[0]+'.'}));return actions.map((x,n)=>{let s=n%3===0?'I can '+x+'.':n%3===1?'You should '+x+'.':'We must '+x+'.';return{q:'Choose the correct sentence.',a:s,w:[x+' can I.','Should you '+x+'.',x+' we must.'],why:s}})}
let key='',deck=[],i=0,points=0,locked=false;const cards=document.getElementById('cards');Object.keys(definitions).forEach(k=>cards.insertAdjacentHTML('beforeend','<article class="game-card"><span class="tag">20 questions</span><h2>'+definitions[k][0]+'</h2><p>'+definitions[k][1]+'</p><button class="btn play" data-key="'+k+'">Play activity ▶</button></article>'));
cards.onclick=e=>{if(e.target.dataset.key)start(e.target.dataset.key)};function start(k){key=k;deck=shuffle(make(k));i=points=0;home.classList.add('hidden');result.classList.add('hidden');playArea.classList.remove('hidden');title.textContent=definitions[k][0];explain.innerHTML='<b>Explanation:</b> '+definitions[k][1];show()}
function show(){locked=false;score.textContent=points;counter.textContent='Question '+(i+1)+' of '+deck.length;bar.style.width=(i/deck.length*100)+'%';feedback.textContent='Choose the correct answer.';let x=deck[i];question.textContent=x.q;let opts=shuffle([x.a,...x.w]);answers.innerHTML=opts.map(o=>'<button class="answer" data-a="'+o+'">'+o+'</button>').join('');answers.querySelectorAll('button').forEach(b=>b.onclick=()=>check(b,x))}
function check(b,x){if(locked)return;locked=true;answers.querySelectorAll('button').forEach(z=>{z.disabled=true;if(z.dataset.a===x.a)z.classList.add('correct')});if(b.dataset.a===x.a){points++;feedback.textContent='✅ Correct! '+x.why;sound(700)}else{b.classList.add('wrong');feedback.textContent='❌ '+x.why;sound(180)}setTimeout(()=>{i++;if(i>=deck.length)finish();else show()},1400)}
function finish(){playArea.classList.add('hidden');result.classList.remove('hidden');finalScore.textContent='You earned '+points+' out of '+deck.length+' points.'}function menu(){playArea.classList.add('hidden');result.classList.add('hidden');home.classList.remove('hidden')}function sound(f){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.06;o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.stop(c.currentTime+.2)}catch(e){}}
backBtn.onclick=menu;menuBtn.onclick=menu;restartBtn.onclick=()=>start(key);againBtn.onclick=()=>start(key);readBtn.onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(question.textContent))}};
</script></body></html>
