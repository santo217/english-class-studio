<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Game Center</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="bar"><div><span class="eyebrow">Llano Limón Elementary School</span><h1>Interactive Game Center</h1></div><nav class="nav"><a href="index.html">Planner</a><a class="active" href="games.html">Games</a><a href="pronunciation.html">Pronunciation</a></nav></div></header><main><section class="card"><span class="eyebrow">Each topic has its own activity</span><h2>Choose a language game</h2><select class="selector" id="game" onchange="start()"><option value="can">CAN — Ability</option><option value="cannot">CANNOT — No ability</option><option value="must">MUST — Rules</option><option value="mustnot">MUST NOT — Prohibition</option><option value="should">SHOULD — Advice</option><option value="shouldnot">SHOULD NOT — Advice against</option><option value="have">I Have / I Do Not Have</option><option value="like">I Like / I Do Not Like</option><option value="verbs">Basic Verbs</option><option value="sentences">Sentence Builder</option></select></section><section class="card quiz"><span class="score" id="score">⭐ 0 points</span><h2 id="title"></h2><p id="explain"></p><div class="example" id="examples"></div><div class="big" id="context"></div><h2 id="prompt"></h2><div id="answers"></div><p id="feedback"><b>Choose an answer.</b></p><button class="button primary" id="next" onclick="next()" hidden>Next question →</button></section></main><script>
const G={can:{t:'CAN: Ability',e:'Use CAN + base verb for an ability.',x:['I can swim.','She can draw.'],q:[['David knows how to ride a bicycle.','🚲',['David can ride a bicycle.','David can rides a bicycle.'],'David can ride a bicycle.'],['Choose the ability.','🏊',['I can swim.','I can cook the pool.'],'I can swim.']]},cannot:{t:'CANNOT: Not Able',e:'Use CANNOT or CAN’T + base verb when someone is not able to do something.',x:['I cannot fly.','The baby can’t read yet.'],q:[['A fish has no legs.','🐟',['A fish cannot walk.','A fish cannot swims.'],'A fish cannot walk.'],['The box is too heavy for Ana.','📦',['Ana cannot lift it.','Ana cannot lifts it.'],'Ana cannot lift it.']]},must:{t:'MUST: Rules',e:'Use MUST + base verb for a necessary action or strong rule.',x:['We must listen.','You must wear gloves.'],q:[['Choose the classroom rule.','👂',['We must listen.','We must listens.'],'We must listen.'],['Gloves are required.','🧤',['You must wear gloves.','You should not wear gloves.'],'You must wear gloves.']]},mustnot:{t:'MUST NOT: Prohibition',e:'Use MUST NOT + base verb when an action is forbidden.',x:['You must not run.','We must not touch fire.'],q:[['The floor is wet.','⚠️',['You must not run.','You must run.'],'You must not run.'],['Protect the plants.','🌳',['We must not damage plants.','We must damage plants.'],'We must not damage plants.']]},should:{t:'SHOULD: Advice',e:'Use SHOULD + base verb to recommend a good action.',x:['You should drink water.','We should recycle.'],q:[['Carlos is tired.','😴',['Carlos should rest.','Carlos should rests.'],'Carlos should rest.'],['We have plastic bottles.','♻️',['We should recycle them.','We should drop them.'],'We should recycle them.']]},shouldnot:{t:'SHOULD NOT: Better Choices',e:'Use SHOULD NOT + base verb to advise against a bad idea.',x:['We should not waste water.','He shouldn’t stay up late.'],q:[['Maria has a test tomorrow.','📚',['She should not stay up late.','She should not study.'],'She should not stay up late.'],['Choose good advice.','🚰',['We should not waste water.','We should waste water.'],'We should not waste water.']]},have:{t:'What’s in My Bag?',e:'Use I HAVE when an item is with you. Use I DO NOT HAVE when it is not.',x:['I have a pencil.','I do not have glue.'],q:[['What is in your bag?','✏️',['I have a pencil.','I do not have a pencil.'],'I have a pencil.'],['Your bag has no glue.','🚫🧴',['I do not have glue.','I have glue.'],'I do not have glue.']]},like:{t:'My Favorites',e:'Use I LIKE for things you enjoy and I DO NOT LIKE for things you do not enjoy.',x:['I like mangoes.','I do not like spiders.'],q:[['The child smiles while playing.','😊⚽',['I like soccer.','I do not like soccer.'],'I like soccer.'],['The child pushes it away.','🥦🙅',['I do not like broccoli.','I like broccoli.'],'I do not like broccoli.']]},verbs:{t:'Action Detective',e:'A verb tells what someone or something does. Use the situation clues.',x:['We clean the room.','Please bring your notebook.'],q:[['Paper is on the floor.','🧻➡️🗑️',['pick up','drink','fly'],'pick up'],['Ana makes a picture.','✏️🖼️',['draw','climb','cook'],'draw'],['We make a recycling box.','📦',['build','borrow','eat'],'build']]},sentences:{t:'Sentence Builder',e:'Build a complete idea: subject + verb/modal + object or extra information.',x:['I like mangoes.','We should clean the classroom.'],q:[['Order: I / apples / like','',['I like apples.','Like I apples.'],'I like apples.'],['Order: we / should / recycle / bottles','',['We should recycle bottles.','We recycle should bottles.'],'We should recycle bottles.'],['Choose the connected sentence.','',['I do not have glue, so I will borrow it.','I no glue and borrow.'],'I do not have glue, so I will borrow it.']]}};let i=0,score=0,locked=false;function start(){i=score=0;locked=false;show()}function show(){const g=G[game.value],q=g.q[i%g.q.length];title.textContent=g.t;explain.textContent=g.e;examples.innerHTML='<b>Examples</b><br>'+g.x.join('<br>');context.textContent=q[1];prompt.textContent=q[0];answers.innerHTML='';q[2].forEach(a=>{const b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>choose(a,q[3],b);answers.appendChild(b)});feedback.innerHTML='<b>Choose an answer.</b>';next.hidden=true;document.getElementById('score').textContent='⭐ '+score+' points'}function choose(a,right,b){if(locked)return;locked=true;if(a===right){score++;b.classList.add('correct');feedback.innerHTML='<b>Correct! Great work.</b>'}else feedback.innerHTML='<b>Try again next time. Correct answer: '+right+'</b>';document.getElementById('score').textContent='⭐ '+score+' points';next.hidden=false}function next(){i++;locked=false;show()}start();
</script></body></html>
