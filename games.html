<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Game Center</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="bar"><div><span class="eyebrow">Llano Limón Elementary School</span><h1>Interactive Game Center</h1></div><nav class="nav"><a href="index.html">Planner</a><a href="activities.html">Evidence</a><a class="active" href="games.html">Games</a><a href="pronunciation.html">Pronunciation</a></nav></div></header><main><section class="card"><span class="eyebrow">20+ questions in every activity</span><h2>Choose a language game</h2><select class="selector" id="game" onchange="start()"><option value="can">CAN — Ability</option><option value="cannot">CANNOT — No ability</option><option value="must">MUST — Rules</option><option value="mustnot">MUST NOT — Prohibition</option><option value="should">SHOULD — Advice</option><option value="shouldnot">SHOULD NOT — Advice against</option><option value="have">I Have / I Do Not Have</option><option value="like">I Like / I Do Not Like</option><option value="verbs">Basic Verbs in Context</option><option value="sentences">Sentence Builder</option></select></section><section class="card quiz"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="score" id="score">⭐ 0 points</span><span class="score" id="counter">Question 1</span></div><h2 id="title"></h2><p id="explain"></p><div class="example" id="examples"></div><div class="big" id="context"></div><h2 id="prompt"></h2><div id="answers"></div><p id="feedback"><b>Choose an answer.</b></p><button class="button primary" id="nextButton" onclick="nextQuestion()" hidden>Next question →</button><button class="button" onclick="start()">Restart activity</button></section></main><footer class="footer">Practice one language purpose at a time · Teacher: Mr. Santo</footer>
<script>
const ability=[['I','swim','🏊'],['You','ride a bicycle','🚲'],['Ana','draw a picture','🎨'],['Carlos','play soccer','⚽'],['We','clean the classroom','🧹'],['They','build a recycling box','📦'],['Sara','sing in English','🎤'],['David','climb the tree','🌳'],['The bird','fly','🐦'],['The fish','swim','🐟'],['My teacher','speak English','👨‍🏫'],['The students','work together','🤝'],['I','write my name','✏️'],['You','open the door','🚪'],['Maria','help her friend','🫶'],['Hector','carry the bag','🎒'],['We','recycle bottles','♻️'],['They','read the poster','📖'],['The baby','walk','👶'],['My dog','jump','🐕'],['Elena','cook rice','🍚'],['Our class','create a campaign','📣'],['I','listen carefully','👂'],['You','raise your hand','🙋']];
const obligations=[['listen to the teacher','👂'],['arrive on time','⏰'],['wear gloves during the clean-up','🧤'],['complete our schoolwork','📝'],['follow the school rules','📋'],['keep the classroom clean','✨'],['bring the required materials','🎒'],['respect our classmates','🤝'],['walk carefully on a wet floor','💧'],['wash our hands before eating','🧼'],['wear a seat belt','🚗'],['return borrowed books','📚'],['put trash in the bin','🗑️'],['care for school materials','✏️'],['wait for the teacher’s signal','✋'],['use safety glasses in the lab','🥽'],['tell the truth','💬'],['protect the environment','🌎'],['work responsibly in teams','👥'],['finish the task before leaving','✅'],['keep emergency exits clear','🚪'],['ask permission before leaving','🙋'],['save our work','💾'],['read the instructions','📖']];
const prohibitions=[['run in the hallway','🏃'],['touch fire','🔥'],['throw trash on the floor','🚯'],['push classmates','🫸'],['damage plants','🌱'],['use phones during a test','📱'],['play with cleaning chemicals','🧴'],['shout in the library','📚'],['write on school walls','🖍️'],['break classroom materials','💥'],['cross the street without looking','🚦'],['enter a restricted area','⛔'],['share passwords','🔐'],['eat unknown plants','🌿'],['leave water running','🚰'],['stand on chairs','🪑'],['touch electrical wires','⚡'],['feed wild animals','🐊'],['open another student’s bag','🎒'],['cheat on a quiz','📝'],['block the emergency exit','🚪'],['bully other students','🤝'],['run near the pool','🏊'],['mix cleaning products','🧪']];
const advice=[['You are tired','rest','😴'],['You are thirsty','drink water','💧'],['You have a test tomorrow','study tonight','📚'],['The classroom has plastic bottles','recycle them','♻️'],['Your friend is sad','talk kindly to your friend','💛'],['You want to learn English','practice every day','🗣️'],['The floor is wet','walk carefully','⚠️'],['Your hands are dirty','wash them','🧼'],['You borrowed a ruler','return it','📏'],['You feel sick','tell an adult','🤒'],['The sun is very strong','wear a hat','☀️'],['You have homework','organize your time','🕒'],['Your team has a problem','listen to everyone','👥'],['There is paper on the floor','pick it up','🗑️'],['Your classmate needs help','help respectfully','🫶'],['You want healthy teeth','brush them twice a day','🦷'],['You do not understand','ask a question','❓'],['The computer is slow','save your work','💻'],['You want a clean school','work responsibly','🏫'],['You made a mistake','try again','🌟'],['You feel angry','take a calm breath','😌'],['You want to speak clearly','practice pronunciation','🔊'],['The plant is dry','water it','🌱'],['Your bag is heavy','carry only what you need','🎒']];
const badAdvice=[['You have a test tomorrow','stay up very late','🌙'],['We want to protect water','waste water','🚰'],['The classroom is clean','throw paper on the floor','🧻'],['Your friend is speaking','interrupt your friend','🗣️'],['You feel sick','ignore a trusted adult','🤒'],['The floor is wet','run quickly','💧'],['You borrowed a book','keep it forever','📚'],['You use the internet','share your password','🔐'],['Your team is working','refuse to listen','👥'],['You want healthy teeth','eat candy all day','🍬'],['The teacher explains','talk loudly','👨‍🏫'],['You see a plant','pull off its leaves','🌿'],['You make a mistake','give up immediately','😞'],['The lights are not needed','leave every light on','💡'],['Your classmate needs help','laugh at the problem','🫶'],['You are in the library','shout','📖'],['You need energy','skip breakfast','🍳'],['You cross the street','look at your phone','🚦'],['You find trash','leave it on the ground','🗑️'],['You feel angry','hit something','😠'],['You use scissors','run with them','✂️'],['You finish drinking water','drop the bottle outside','♻️'],['You want to improve English','avoid all practice','🇬🇧'],['You disagree','use disrespectful words','💬']];
const schoolItems=[['pencil','✏️'],['notebook','📓'],['eraser','🧽'],['ruler','📏'],['glue','🧴'],['scissors','✂️'],['book','📘'],['crayons','🖍️'],['backpack','🎒'],['calculator','🧮'],['marker','🖊️'],['paper','📄'],['folder','📁'],['lunch box','🍱'],['water bottle','🍼'],['paintbrush','🖌️'],['dictionary','📖'],['colored pencils','✏️'],['stapler','📎'],['tape','🧻'],['tablet','📱'],['headphones','🎧'],['flashcards','🃏'],['recycling box','♻️']];
const preferences=[['mangoes','🥭'],['soccer','⚽'],['drawing','🎨'],['reading','📚'],['music','🎵'],['dogs','🐕'],['cats','🐈'],['broccoli','🥦'],['spiders','🕷️'],['loud noises','🔊'],['rainy days','🌧️'],['English class','🇬🇧'],['dancing','💃'],['cleaning the park','🌳'],['recycling','♻️'],['swimming','🏊'],['chocolate','🍫'],['science','🔬'],['video games','🎮'],['singing','🎤'],['vegetables','🥕'],['working in teams','🤝'],['writing stories','✍️'],['helping others','🫶']];
const verbData=[['add','put something together with something else'],['allow','give permission'],['ask','say a question'],['believe','think something is true'],['borrow','use something and return it later'],['break','damage something into pieces'],['bring','carry something to a place'],['build','make something from parts'],['buy','pay money for something'],['call','speak to someone by phone'],['choose','select one option'],['clean','remove dirt or trash'],['climb','move upward using hands and feet'],['close','shut something'],['cook','prepare food with heat'],['create','make something new'],['cry','produce tears when sad'],['dance','move your body to music'],['describe','tell what something is like'],['do','perform an action'],['draw','make a picture'],['drink','take liquid into your mouth'],['eat','take food into your body'],['enjoy','take pleasure in something'],['feel','experience an emotion'],['find','discover something you looked for'],['fly','move through the air'],['give','hand something to another person'],['go','move to another place'],['help','make a task easier for someone']];
function q(prompt,context,options,answer,why){return{prompt,context,options,answer,why}}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function modalQuestions(type){if(type==='can')return ability.map(([s,v,c])=>q(`${s} has this ability. Choose the correct sentence.`,c,shuffle([`${s} can ${v}.`,`${s} can ${v}s.`,`${s} ${v} can.`]),`${s} can ${v}.`,'Use subject + can + base verb.'));if(type==='cannot')return ability.map(([s,v,c],i)=>q(`${s} is not able to do this yet.`,c,shuffle([`${s} cannot ${v}.`,`${s} cannot ${v}s.`,`${s} not can ${v}.`]),`${s} cannot ${v}.`,'Use cannot + the base verb.'));if(type==='must')return obligations.map(([v,c])=>q('Choose the necessary action or strong rule.',c,shuffle([`We must ${v}.`,`We must not ${v}.`,`We must ${v}s.`]),`We must ${v}.`,'Must expresses a necessary action.'));if(type==='mustnot')return prohibitions.map(([v,c])=>q('Choose the prohibition.',c,shuffle([`We must not ${v}.`,`We must ${v}.`,`We should ${v}.`]),`We must not ${v}.`,'Must not means the action is forbidden.'));if(type==='should')return advice.map(([s,v,c])=>q(`${s}. What is good advice?`,c,shuffle([`You should ${v}.`,`You should not ${v}.`,`You should ${v}s.`]),`You should ${v}.`,'Should gives helpful advice.'));return badAdvice.map(([s,v,c])=>q(`${s}. Which action is a bad idea?`,c,shuffle([`You should not ${v}.`,`You should ${v}.`,`You must ${v}.`]),`You should not ${v}.`,'Should not advises against a bad idea.'))}
const descriptions={can:['CAN: Ability','Use CAN + base verb for something a person is able to do.',['I can swim.','She can draw.']],cannot:['CANNOT: Not Able','Use CANNOT or CAN’T + base verb when someone is not able to do something.',['I cannot fly.','The baby can’t read yet.']],must:['MUST: Strong Rules','Use MUST + base verb for necessary actions and strong rules.',['We must listen.','You must wear gloves.']],mustnot:['MUST NOT: Prohibition','Use MUST NOT + base verb when an action is forbidden.',['You must not run.','We must not touch fire.']],should:['SHOULD: Helpful Advice','Use SHOULD + base verb to recommend a good action.',['You should drink water.','We should recycle.']],shouldnot:['SHOULD NOT: Better Choices','Use SHOULD NOT + base verb to advise against a bad idea.',['We should not waste water.','He shouldn’t stay up late.']]};
function makeGame(kind){if(descriptions[kind]){const d=descriptions[kind];return{title:d[0],explain:d[1],examples:d[2],questions:modalQuestions(kind)}}if(kind==='have')return{title:'What’s in My Bag?',explain:'Choose I HAVE when the item is present and I DO NOT HAVE when it is missing.',examples:['I have a pencil.','I do not have glue.'],questions:schoolItems.map(([x,c],i)=>q(i%2?`The ${x} is not in your bag.`:`The ${x} is in your bag.`,c,shuffle([`I have ${x}.`,`I do not have ${x}.`]),i%2?`I do not have ${x}.`:`I have ${x}.`,'Match the sentence to what is present or missing.'))}if(kind==='like')return{title:'My Preferences',explain:'Use I LIKE for things you enjoy and I DO NOT LIKE for things you do not enjoy.',examples:['I like mangoes.','I do not like spiders.'],questions:preferences.map(([x,c],i)=>q(i%2?`The child shows a negative reaction to ${x}.`:`The child enjoys ${x}.`,c,shuffle([`I like ${x}.`,`I do not like ${x}.`]),i%2?`I do not like ${x}.`:`I like ${x}.`,'The sentence expresses the pictured preference.'))}if(kind==='verbs')return{title:'Basic Verbs in Context',explain:'A verb tells what someone or something does. Read the meaning and identify the action.',examples:['We clean the room.','Please bring your notebook.'],questions:verbData.map(([v,d],i)=>{const wrong=[verbData[(i+5)%verbData.length][0],verbData[(i+11)%verbData.length][0]];return q(`Which verb means: ${d}?`,'🔎',shuffle([v,...wrong]),v,`${v} means “${d}.”`)})};const data=[...ability.slice(0,12).map(([s,v,c])=>[`${s} / can / ${v}`,`${s} can ${v}.`,c]),...obligations.slice(0,6).map(([v,c])=>[`we / must / ${v}`,`We must ${v}.`,c]),...advice.slice(0,6).map(([s,v,c])=>[`you / should / ${v}`,`You should ${v}.`,c])];return{title:'Sentence Builder',explain:'Build a complete idea using subject + modal + base verb + extra information.',examples:['I can swim.','We should recycle paper.'],questions:data.map(([words,right,c])=>q(`Put the words in order: ${words}`,c,shuffle([right,`Can ${right}`,right.replace(' can ',' can to ').replace(' must ',' must to ').replace(' should ',' should to ')]),right,'Use subject + modal + base verb.'))}}
let index=0,points=0,locked=false,current;function start(){current=makeGame(game.value);index=points=0;locked=false;show()}function show(){const item=current.questions[index];title.textContent=current.title;explain.textContent=current.explain;examples.innerHTML='<b>Expanded activity:</b> '+current.questions.length+' questions<br><b>Examples</b><br>'+current.examples.join('<br>');context.textContent=item.context;prompt.textContent=item.prompt;answers.innerHTML='';item.options.forEach(a=>{const b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>choose(a,item.answer,b,item.why);answers.appendChild(b)});score.textContent='⭐ '+points+' points';counter.textContent=`Question ${index+1} of ${current.questions.length}`;feedback.innerHTML='<b>Choose an answer.</b>';nextButton.hidden=true}function choose(a,right,b,why){if(locked)return;locked=true;if(a===right){points++;b.classList.add('correct');feedback.innerHTML='<b>Correct! '+why+'</b>'}else feedback.innerHTML='<b>Keep learning. Correct answer: '+right+' '+why+'</b>';score.textContent='⭐ '+points+' points';nextButton.hidden=false}function nextQuestion(){index++;locked=false;if(index>=current.questions.length){feedback.innerHTML=`<b>Activity complete! Final score: ${points}/${current.questions.length}</b>`;nextButton.hidden=true;return}show()}start();
</script></body></html>
