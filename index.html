<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Class Studio</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="bar"><div><span class="eyebrow">Llano Limón Elementary School</span><h1>English Class Studio</h1></div><nav class="nav"><a class="active" href="index.html">Planner</a><a href="games.html">Game Center</a><a href="pronunciation.html">Pronunciation</a></nav></div></header><main><section class="card"><span class="eyebrow">Plan from the outcome</span><h2>Today’s learning destination</h2><div class="fields"><label>Grade<select id="grade"><option>Kindergarten</option><option>Fourth Grade</option><option>Fifth Grade A</option><option>Fifth Grade B</option><option>Sixth Grade</option></select></label><label>Scenario<input id="scenario" value="Our Routines"></label><label>Theme<input id="theme" value="First, I Sit Down"></label><label>Skill<select id="skill"><option>Listening</option><option>Reading</option><option>Speaking</option><option>Writing</option><option>Mediation</option><option>Integrated skills</option></select></label></div><label style="display:block;margin-top:14px">Specific SMART objective<textarea id="objective">Students will be able to listen to simple classroom routine commands and respond with the correct action in a whole-class game by the end of the lesson.</textarea></label><p class="notice">Plan all six stages, but teach them across the periods your students need. They do not have to fit into one lesson.</p></section><section class="grid" id="stages"></section><section class="card"><button class="button primary" onclick="savePlan()">Save lesson on this device</button> <span id="status"></span></section></main><footer class="footer">Teacher: Mr. Santo · Editable classroom tool</footer><script>
const stageInfo=[['Warm-up / Pre-task','Engage, model key language, and clarify the purpose.'],['Presentation','Present vocabulary and structures in a meaningful context.'],['Preparation','Practice with collaboration, models, pictures, or sentence frames.'],['Performance','Students use English to complete the meaningful task.'],['Assessment / Post-task','Check achievement and give useful feedback.'],['Reflection','Students think about what they learned and used.']];const ideas=['Play a short action song and review familiar language.','Model three examples with real objects and clear gestures.','Students rehearse with a partner using picture prompts.','Teams complete a real-world challenge using the target English.','Use a quick check directly connected to the objective.','Students complete: Today I can… and choose a feeling face.'];const box=document.getElementById('stages');stageInfo.forEach((s,i)=>box.insertAdjacentHTML('beforeend',`<article class="stage" id="stage${i}"><span class="num">${i+1}</span><h3>${s[0]}</h3><p>${s[1]}</p><textarea id="activity${i}" placeholder="Write your activity here..."></textarea><p><button class="button" onclick="suggest(${i})">Suggest activity</button> <button class="button" onclick="done(${i})">Completed</button></p></article>`));function suggest(i){document.getElementById('activity'+i).value=ideas[i]+'\n\nConnection: '+document.getElementById('objective').value}function done(i){document.getElementById('stage'+i).classList.toggle('done')}function savePlan(){const data={};['grade','scenario','theme','skill','objective'].forEach(x=>data[x]=document.getElementById(x).value);data.activities=stageInfo.map((_,i)=>document.getElementById('activity'+i).value);localStorage.setItem('english-class-plan',JSON.stringify(data));document.getElementById('status').textContent='Lesson saved!'}const old=localStorage.getItem('english-class-plan');if(old){const d=JSON.parse(old);['grade','scenario','theme','skill','objective'].forEach(x=>{if(d[x])document.getElementById(x).value=d[x]});(d.activities||[]).forEach((v,i)=>document.getElementById('activity'+i).value=v)}
</script></body></html>
