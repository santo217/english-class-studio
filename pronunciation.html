<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pronunciation Lab</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="bar"><div><span class="eyebrow">Listen · Notice · Repeat</span><h1>Pronunciation Lab</h1></div><nav class="nav"><a href="index.html">Planner</a><a href="games.html">Games</a><a class="active" href="pronunciation.html">Pronunciation</a></nav></div></header><main><section class="card"><h2>From basic sounds to confident speech</h2><p>Listen first, notice the sound or rhythm, repeat, and use it in a meaningful sentence.</p><div class="level-buttons" id="levels"></div></section><section class="card quiz"><span class="eyebrow" id="tag"></span><h2 id="name"></h2><p id="guide"></p><h3 id="focus"></h3><div id="words"></div><p class="sentence" id="line"></p><button class="button" onclick="speak(.65)">🐢 Listen slowly</button> <button class="button primary" onclick="speak(1)">🔊 Listen & repeat</button><p><button class="button" onclick="previous()">← Previous</button> <button class="button" onclick="next()">Next →</button></p></section></main><script>
const L=[{n:'Basic Sounds',g:'Listen and distinguish clear sounds. Repeat slowly.',i:[['/p/ and /b/',['pen','book'],'Please bring the blue book.'],['/t/ and /d/',['ten','door'],'Touch the door.'],['/s/ and /z/',['sit','zip'],'Sit beside Zara.']]},{n:'Words & Syllables',g:'Clap once for every syllable, then say the word naturally.',i:[['Two syllables',['ta-ble','pen-cil'],'Put the pencil on the table.'],['Three syllables',['re-cy-cle','en-vi-ron-ment'],'We recycle for the environment.']]},{n:'Sentence Rhythm',g:'Stress important words and connect the sentence.',i:[['Content-word stress',['MUST','GLOVES'],'You MUST wear GLOVES.'],['Thought groups',['first','then'],'First, pick it up; then, put it in the bin.']]},{n:'Fluency Challenge',g:'Speak clearly at a natural pace with expression and accurate endings.',i:[['Question intonation',['Can you…?','Do you…?'],'Can you bring a broom, please?'],['Connected speech',['should have','next time'],'We should have cleaned it the first time.']]}];let l=0,p=0;const lev=document.getElementById('levels');L.forEach((x,i)=>{const b=document.createElement('button');b.className='button';b.textContent='Level '+(i+1)+': '+x.n;b.onclick=()=>{l=i;p=0;show()};lev.appendChild(b)});function show(){const x=L[l],y=x.i[p];tag.textContent='Level '+(l+1);name.textContent=x.n;guide.textContent=x.g;focus.textContent='Focus: '+y[0];words.innerHTML='';y[1].forEach(w=>{const b=document.createElement('button');b.className='sound';b.textContent='🔊 '+w;b.onclick=()=>say(w,.65);words.appendChild(b)});line.textContent=y[2]}function say(t,r){const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r;speechSynthesis.cancel();speechSynthesis.speak(u)}function speak(r){say(L[l].i[p][2],r)}function next(){p=(p+1)%L[l].i.length;show()}function previous(){p=(p-1+L[l].i.length)%L[l].i.length;show()}show();
</script></body></html>
