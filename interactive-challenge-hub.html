<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Challenge Hub</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef5fb;color:#17324d}header{background:#142f4c;color:#fff;padding:14px 4%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}header h1{margin:0}header a{color:white}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:white;border-radius:22px;padding:20px;box-shadow:0 8px 26px #16324f20;margin-bottom:17px}.center{text-align:center}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.choicebox{background:#f7fafd;border:2px solid #dce6ef;border-radius:17px;padding:14px}.choicebox h3{margin-top:0}.choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.btn{border:0;border-radius:13px;padding:11px 15px;font-size:1rem;font-weight:900;cursor:pointer;box-shadow:0 4px #0002;background:#e7eef5;color:#18334d}.btn:active{transform:translateY(3px)}.btn.active{background:#173c63;color:#fff;outline:4px solid #f5c842}.start{background:#219653;color:#fff;font-size:1.25rem;padding:14px 28px}.hidden{display:none!important}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.team{border-radius:14px;padding:10px;color:white;text-align:center}.blue{background:#2f80ed}.red{background:#eb5757}.turn{text-align:center;font-weight:900}.score{font-size:1.7rem;font-weight:900}.scene{height:230px;border-radius:20px;margin:15px 0;position:relative;overflow:hidden;background:linear-gradient(#9edcff 0 66%,#75c66b 66%);border:4px solid #e7eef5}.scene *{transition:.45s}.question{text-align:center;font-size:clamp(1.45rem,4vw,2.4rem);font-weight:900;margin:14px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.answer{min-height:66px;border:3px solid #cad7e3;background:#f8fbfd;border-radius:15px;font-size:1.15rem;font-weight:900;cursor:pointer}.answer:hover{background:#e7f3ff;border-color:#2f80ed}.correct{background:#c9f4d3!important;border-color:#219653!important}.wrong{background:#ffd1d1!important;border-color:#eb5757!important}.feedback{text-align:center;font-size:1.15rem;font-weight:900;min-height:34px;margin:10px}.tools{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.progress{height:10px;background:#dfe8ef;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:#27ae60;width:0}.rope{position:absolute;top:105px;left:5%;right:5%;height:12px;background:#965f2c}.knot{position:absolute;top:-15px;left:50%;width:42px;height:42px;border:5px solid #6c3e19;border-radius:50%;background:#d9984d}.people{position:absolute;top:125px;left:7%;right:7%;display:flex;justify-content:space-between;font-size:48px}.balloon{position:absolute;font-size:55px;animation:float 2s infinite alternate}.balloon:nth-child(2){left:22%;top:70px}.balloon:nth-child(3){left:48%;top:25px}.balloon:nth-child(4){left:72%;top:85px}.balloon:nth-child(5){left:88%;top:35px}@keyframes float{to{transform:translateY(-18px)}}.pets{display:flex;justify-content:space-around;align-items:end;height:100%;font-size:75px}.bowl{font-size:45px}.space{background:radial-gradient(circle at 50% 80%,#26356f,#070b24)}.aliens{color:white;font-size:45px;display:flex;justify-content:space-around;padding-top:35px}.ship{position:absolute;bottom:15px;left:45%;font-size:65px}.clawbg{background:linear-gradient(#4338a1,#8a4fc4)}.claw{position:absolute;left:45%;top:0;font-size:70px}.prizes{position:absolute;bottom:10px;left:5%;right:5%;font-size:50px;display:flex;justify-content:space-around}.label{text-align:center;font-weight:900;color:#617184}.win{text-align:center;font-size:1.35rem}@media(max-width:760px){.steps{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.scene{height:190px}.top{grid-template-columns:1fr 1fr}.turn{grid-column:1/-1;grid-row:1}}
</style></head><body><header><h1>🕹️ Interactive Challenge Hub</h1><a href="index.html">← English Class Studio</a></header><main class="wrap">
<section class="card center" id="setup"><h2>Build Your Classroom Challenge</h2><div class="steps"><div class="choicebox"><h3>1. Choose a topic</h3><div class="choices" id="topics"></div></div><div class="choicebox"><h3>2. Choose a level</h3><div class="choices" id="levels"><button class="btn active" data-v="1">Level 1<br>Basic</button><button class="btn" data-v="2">Level 2<br>Developing</button><button class="btn" data-v="3">Level 3<br>Challenge</button></div></div><div class="choicebox"><h3>3. Choose a game</h3><div class="choices" id="games"></div></div></div><p id="description">Simple words and short sentences for beginners.</p><button class="btn start" id="start">Start Challenge ▶</button></section>
<section class="card hidden" id="play"><div class="top"><div class="team blue">BLUE TEAM<div class="score" id="blueScore">0</div></div><div class="turn"><div id="gameName"></div><div id="turnName"></div></div><div class="team red">RED TEAM<div class="score" id="redScore">0</div></div></div><div class="progress"><i id="progress"></i></div><div class="scene" id="scene"></div><div class="label" id="prompt"></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="tools"><button class="btn" id="speak">🔊 Read</button><button class="btn" id="skip">Skip</button><button class="btn" id="menu">New challenge</button></div></section>
<section class="card hidden win" id="win"><div style="font-size:70px">🏆🎉</div><h2 id="winner"></h2><p id="result"></p><button class="btn start" id="again">Play Again</button> <button class="btn" id="home">Choose Another</button></section></main><script>
const topicNames={can:"Can / Can't",like:"Like / Don't Like",have:"Have / Don't Have",must:"Must / Mustn't",should:"Should / Shouldn't",verbs:"Basic Verbs"};
const gameNames={tug:"Tug of War",balloon:"Balloon Pop",pets:"Cat & Dog Dinner Battle",alien:"Alien Invasion",claw:"Claw Machine"};
const acts=['swim','run','jump','dance','sing','read','write','draw','cook','climb','ride a bike','play soccer','speak English','help my family','clean my room','open the door','carry the bag','answer the question','use a computer','play the guitar'];
const food=['apples','bananas','rice','chicken','pizza','milk','oranges','sandwiches','fish','bread','cheese','salad','carrots','mangoes','soup','cookies','grapes','watermelon','pasta','ice cream'];
const things=['a pencil','a book','an eraser','a ruler','a backpack','a notebook','a red pen','two crayons','a lunch box','a bottle','a ball','a toy','a computer','a dictionary','a marker','some paper','a uniform','a blue folder','three stickers','a small bag'];
const good=['listen to the teacher','do your homework','raise your hand','be kind','walk in class','keep the room clean','bring your book','follow instructions','share materials','arrive on time','respect classmates','use kind words','put trash in the bin','take care of books','wash your hands','wait for your turn','work with your team','complete your work','tell the truth','help others'];
const bad=['run in class','hit classmates','throw trash','shout','break materials','push others','cheat','use bad words','leave without permission','play with scissors','write on the wall','take things','interrupt others','damage books','fight','ignore instructions','make fun of others','climb on chairs','waste water','hurt animals'];
const verbPairs=[['🏃','run'],['🦘','jump'],['🍎','eat'],['🥤','drink'],['📖','read'],['✏️','write'],['😴','sleep'],['🏊','swim'],['🎤','sing'],['💃','dance'],['🍳','cook'],['🧹','clean'],['🧗','climb'],['🎨','draw'],['👂','listen'],['🗣️','speak'],['📂','open'],['📕','close'],['🪑','sit'],['🧍','stand']];
const shuffle=a=>[...a].sort(()=>Math.random()-.5),random=a=>a[Math.floor(Math.random()*a.length)];
let topic='can',level=1,game='tug',deck=[],qIndex=0,turn='blue',scores={blue:0,red:0},power=0,locked=false;
function chooseBox(id,names,initial){let el=document.getElementById(id);Object.entries(names).forEach(([k,v],i)=>el.insertAdjacentHTML('beforeend','<button class="btn '+(k===initial?'active':'')+'" data-v="'+k+'">'+v+'</button>'));el.onclick=e=>{if(!e.target.dataset.v)return;el.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');if(id==='topics')topic=e.target.dataset.v;else game=e.target.dataset.v}}
chooseBox('topics',topicNames,'can');chooseBox('games',gameNames,'tug');levels.onclick=e=>{if(!e.target.dataset.v)return;levels.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');level=+e.target.dataset.v;description.textContent=level===1?'Simple words and short sentences for beginners.':level===2?'Longer sentences with classroom and home situations.':'Meaningful situations that require careful thinking.'};
function make(){let arr=[];if(topic==='verbs')return shuffle(verbPairs).map(v=>({p:'Choose the action verb.',q:v[0],a:v[1],w:shuffle(verbPairs.filter(x=>x[1]!==v[1]).map(x=>x[1])).slice(0,3)}));let source=topic==='like'?food:topic==='have'?things:topic==='can'?acts:good;source.forEach((x,i)=>{let positive=i%2===0,a,w,p;if(topic==='can'){a=positive?'I can':'I cannot';w=['I have','I like','I must'];p='Complete the sentence:'}if(topic==='like'){a=positive?'I like':"I don't like";w=['I have','I can','I must'];p='Express a preference:'}if(topic==='have'){a=positive?'I have':"I don't have";w=['I like','I can','I should'];p='Express possession:'}if(topic==='must'){let y=i%3===0?bad[i]:x;positive=i%3!==0;a=positive?'You must':"You mustn't";w=['You can','You have','You like'];x=y;p='Choose the correct school rule:'}if(topic==='should'){let y=i%3===0?bad[i]:x;positive=i%3!==0;a=positive?'You should':"You shouldn't";w=['You have','You like','You can'];x=y;p='Choose the best advice:'}let lead=level===1?'___ ':level===2?'At school, ___ ':positive?'What is the best choice? ___ ':'Think carefully: ___ ';arr.push({p,q:lead+x+'.',a,w})});return shuffle(arr)}
function sceneHTML(){if(game==='tug')return '<div class="rope" id="moving"><div class="knot"></div></div><div class="people">🧒💪<span>💪🧒</span></div>';if(game==='balloon')return '<div class="balloon" id="moving">🎈</div><div class="balloon">🎈</div><div class="balloon">🎈</div><div class="balloon">🎈</div><div class="balloon">🎈</div>';if(game==='pets')return '<div class="pets"><div>🐱<span class="bowl" id="leftBowl">🥣</span></div><div><span class="bowl" id="rightBowl">🥣</span>🐶</div></div>';if(game==='alien')return '<div class="aliens" id="aliens">👾 👽 👾 👽 👾</div><div class="ship" id="moving">🚀</div>';return '<div class="claw" id="moving">🪝</div><div class="prizes">🧸 ⚽ 🚗 🎁 🦄</div>'}
function startGame(){deck=make().slice(0,level===1?10:level===2?15:20);qIndex=0;turn='blue';scores={blue:0,red:0};power=0;setup.classList.add('hidden');win.classList.add('hidden');play.classList.remove('hidden');scene.className='scene '+(game==='alien'?'space':game==='claw'?'clawbg':'');scene.innerHTML=sceneHTML();gameName.textContent=gameNames[game]+' · '+topicNames[topic]+' · Level '+level;draw();show()}
function draw(){blueScore.textContent=scores.blue;redScore.textContent=scores.red;turnName.textContent=turn.toUpperCase()+" TEAM'S TURN";progress.style.width=(qIndex/deck.length*100)+'%';let m=document.getElementById('moving');if(m){if(game==='tug')m.style.transform='translateX('+(power*5)+'%)';if(game==='balloon')m.style.left=(10+qIndex*5)%85+'%';if(game==='alien')m.style.left=(10+scores[turn]*11)%80+'%';if(game==='claw')m.style.left=(8+qIndex*7)%82+'%'}if(game==='pets'){leftBowl.textContent='🍗'.repeat(Math.min(scores.blue,5))||'🥣';rightBowl.textContent='🍗'.repeat(Math.min(scores.red,5))||'🥣'}}
function show(){if(qIndex>=deck.length)return finish();locked=false;let x=deck[qIndex];prompt.textContent=x.p;question.textContent=x.q;feedback.textContent='Choose the correct answer.';answers.innerHTML=shuffle([x.a,...x.w]).map(a=>'<button class="answer" data-a="'+a+'">'+a+'</button>').join('');answers.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b,x));draw()}
function answer(b,x){if(locked)return;locked=true;answers.querySelectorAll('button').forEach(z=>{z.disabled=true;if(z.dataset.a===x.a)z.classList.add('correct')});if(b.dataset.a===x.a){scores[turn]++;power+=turn==='blue'?-1:1;feedback.textContent='✅ Correct! '+x.a+' '+x.q.replace('___ ','').replace('At school, ___ ','').replace('What is the best choice? ___ ','').replace('Think carefully: ___ ','');tone(720);if(game==='balloon')b.textContent='💥 POP!'}else{b.classList.add('wrong');feedback.textContent='❌ Correct answer: '+x.a;tone(170)}setTimeout(()=>{turn=turn==='blue'?'red':'blue';qIndex++;show()},1300)}
function finish(){play.classList.add('hidden');win.classList.remove('hidden');let w=scores.blue===scores.red?'It is a tie!':(scores.blue>scores.red?'BLUE TEAM WINS!':'RED TEAM WINS!');winner.textContent=w;result.textContent='Blue '+scores.blue+' — '+scores.red+' Red';tone(900)}
function tone(f){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.06;o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.stop(c.currentTime+.2)}catch(e){}}
function goHome(){play.classList.add('hidden');win.classList.add('hidden');setup.classList.remove('hidden')}start.onclick=startGame;again.onclick=startGame;home.onclick=goHome;menu.onclick=goHome;skip.onclick=()=>{turn=turn==='blue'?'red':'blue';qIndex++;show()};speak.onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(question.textContent))}};
</script></body></html>
